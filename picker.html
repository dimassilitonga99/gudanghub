<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <title>GudangHub — Picker Dashboard</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./public/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="./src/styles/main.css">

  <style>
    body {
      background: var(--ink);
      min-height: 100dvh;
    }

    /* TOPBAR */
    .topbar {
      background: var(--ink-2);
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 20px;
      padding-top: calc(12px + var(--safe-top));
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }

    .topbar-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
    }

    .topbar-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-title em {
      color: #3b82f6;
      font-style: normal;
    }

    .picker-badge {
      padding: 3px 10px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 20px;
      color: #3b82f6;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .topbar-action {
      display: grid;
      min-width: 36px;
      min-height: 36px;
      place-items: center;
      padding: 8px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }

    .topbar-action:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    .topbar-action.logout:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* CONTENT */
    .content {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* STATS */
    .picker-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .picker-stat {
      background: var(--card);
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 16px;
    }

    .picker-stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .picker-stat-value {
      font-size: 26px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* FILTER */
    .picker-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .picker-filter::-webkit-scrollbar { display: none; }

    .picker-filter-btn {
      flex-shrink: 0;
      padding: 8px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      min-height: 36px;
    }

    .picker-filter-btn:hover { color: var(--text); }

    .picker-filter-btn.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.12);
      color: #3b82f6;
    }

    /* ORDER LIST */
    .picker-orders {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .picker-order-card {
      background: var(--card);
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .picker-order-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
    }

    .picker-order-card.picked {
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(59, 130, 246, 0.03);
    }

    .picker-order-header {
      padding: 16px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .picker-order-id {
      font-family: var(--font-mono);
      font-size: 12px;
      color: #3b82f6;
      font-weight: 700;
    }

    .picker-order-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .picker-order-status {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .picker-order-status.pending {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .picker-order-status.picked {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    /* ORDER ITEMS */
    .picker-items {
      padding: 12px 16px;
    }

    .picker-item {
      display: grid;
      grid-template-columns: 32px 1fr 80px 100px;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
      font-size: 12px;
    }

    .picker-item:last-child { border-bottom: none; }

    .picker-item-check {
      display: grid;
      place-items: center;
    }

    .picker-item-check input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    .picker-item-info {
      min-width: 0;
    }

    .picker-item-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .picker-item-code {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #3b82f6;
    }

    .picker-item-qty {
      text-align: center;
      font-weight: 700;
      color: var(--orange);
      font-size: 14px;
    }

    .picker-item-stok {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .picker-stok-input {
      width: 100%;
      background: var(--ink-3);
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      text-align: center;
      min-height: 30px;
      transition: border-color 0.15s;
    }

    .picker-stok-input:focus {
      border-color: #3b82f6;
    }

    .picker-stok-label {
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
    }

    /* CATATAN PICKER */
    .picker-note-section {
      padding: 12px 16px;
      border-top: 1px solid var(--line-soft);
    }

    .picker-note-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .picker-note-input {
      width: 100%;
      background: var(--ink-3);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      min-height: 60px;
      transition: border-color 0.15s;
    }

    .picker-note-input:focus {
      border-color: #3b82f6;
    }

    /* SUBMIT BUTTON */
    .picker-order-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-picker-submit {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-picker-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.5);
    }

    .btn-picker-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* EMPTY STATE */
    .picker-empty {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .picker-empty-icon {
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 3px solid var(--line-soft);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .picker-stats { grid-template-columns: repeat(2, 1fr); }
      .picker-item { grid-template-columns: 28px 1fr 60px 80px; gap: 6px; }
      .content { padding: 12px; }
    }

    @media (max-width: 480px) {
      .picker-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .picker-stat { padding: 12px; }
      .picker-stat-value { font-size: 22px; }
      .picker-item { grid-template-columns: 28px 1fr; gap: 6px; }
      .picker-item-qty, .picker-item-stok { grid-column: 2; }
    }

        /* ═══ PICKER ITEMS HEADER ═══ */
    .picker-items-header {
      display: grid;
      grid-template-columns: 32px 1fr 80px 100px;
      gap: 10px;
      padding: 8px 16px 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--line-soft);
    }

    /* QTY section */
    .picker-item-qty-section {
      text-align: center;
    }

    .picker-qty-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .picker-qty-value {
      font-size: 16px;
      font-weight: 800;
      color: var(--orange);
    }

    /* Status colors */
    .picker-order-card.approved {
      border-color: rgba(34, 197, 94, 0.3);
      opacity: 0.7;
    }

    .picker-order-card.rejected {
      border-color: rgba(239, 68, 68, 0.3);
      opacity: 0.6;
    }

    .picker-order-status.approved {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
    }

    .picker-order-status.rejected {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    /* Re-submit button (biru tua) */
    .btn-picker-resubmit {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-picker-resubmit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
    }

    /* Refresh button */
    .btn-refresh-picker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 8px;
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      min-height: 36px;
    }

    .btn-refresh-picker:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    @media (max-width: 480px) {
      .picker-items-header {
        grid-template-columns: 28px 1fr;
        gap: 6px;
      }
      .picker-items-header > div:nth-child(3),
      .picker-items-header > div:nth-child(4) {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">
      <span data-icon="package" data-icon-size="20"></span>
    </div>
    <div class="topbar-title">
      Gudang<em>Hub</em>
      <span class="picker-badge">PICKER</span>
    </div>

    <div id="pickerUserInfo" style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
      <span id="pickerUserName" style="font-size: 12px; font-weight: 700; color: var(--text);">-</span>
    </div>

    <a class="topbar-action" href="./ganti-password.html" title="Ganti Password">
      <span data-icon="key" data-icon-size="16"></span>
    </a>

    <button class="topbar-action logout" id="btnLogout" type="button" title="Keluar">
      <span data-icon="logout" data-icon-size="16"></span>
    </button>
  </header>

  <!-- CONTENT -->
  <main class="content">

    <div class="page-header">
      <h1>
        <span data-icon="package" data-icon-size="24" data-icon-color="#3b82f6"></span>
        Picker Dashboard
      </h1>
           <p>
        Verifikasi & siapkan barang order sebelum dikirim ke Admin
        <button class="btn-refresh-picker" id="btnRefreshPicker" type="button" style="margin-left: 12px;">
          <span data-icon="refresh" data-icon-size="14"></span>
          Refresh
        </button>
      </p>
    </div>

    <!-- STATS -->
    <div class="picker-stats" id="pickerStats">
      <div class="picker-stat">
        <div class="picker-stat-label">
          <span data-icon="clock" data-icon-size="12"></span>
          Menunggu
        </div>
        <div class="picker-stat-value" id="statPending" style="color: var(--warning);">-</div>
      </div>
      <div class="picker-stat">
        <div class="picker-stat-label">
          <span data-icon="check-check" data-icon-size="12"></span>
          Sudah Dicek
        </div>
        <div class="picker-stat-value" id="statPicked" style="color: #3b82f6;">-</div>
      </div>
      <div class="picker-stat">
        <div class="picker-stat-label">
          <span data-icon="check-circle" data-icon-size="12"></span>
          Disetujui
        </div>
        <div class="picker-stat-value" id="statApproved" style="color: var(--success);">-</div>
      </div>
      <div class="picker-stat">
        <div class="picker-stat-label">
          <span data-icon="package" data-icon-size="12"></span>
          Total
        </div>
        <div class="picker-stat-value" id="statTotal" style="color: var(--text);">-</div>
      </div>
    </div>

    <!-- FILTER -->
    <div class="picker-filter" id="pickerFilter">
      <button class="picker-filter-btn active" type="button" data-filter="ALL">
        <span data-icon="list" data-icon-size="14"></span>
        Semua
      </button>
      <button class="picker-filter-btn" type="button" data-filter="PENDING">
        <span data-icon="clock" data-icon-size="14"></span>
        Menunggu
      </button>
      <button class="picker-filter-btn" type="button" data-filter="PICKED">
        <span data-icon="check-check" data-icon-size="14"></span>
        Sudah Dicek
      </button>
      <button class="picker-filter-btn" type="button" data-filter="APPROVED">
        <span data-icon="check-circle" data-icon-size="14"></span>
        Disetujui
      </button>
    </div>

    <!-- ORDER LIST -->
    <div class="picker-orders" id="pickerOrders">
      <div class="picker-empty">
        <div class="loading-spinner"></div>
        <p>Memuat order...</p>
      </div>
    </div>

  </main>

  <script type="module" src="./src/js/pages/picker.js"></script>
</body>
</html>
